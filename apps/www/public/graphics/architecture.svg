<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" aria-labelledby="archTitle archDesc" role="img" viewBox="0 0 1200 720"><title id="archTitle">Rakazo deployment</title><desc id="archDesc">Web, desktop, and mobile clients talk to an API. A worker and Postgres sit beside it. The computer defaults to Docker. Prompts go to the model provider you configure.</desc><rect width="1200" height="720" fill="#fdfdfd"/><text x="48" y="64" fill="#242424" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="600">A Rakazo deployment</text><text x="48" y="98" fill="#6d6e70" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="16">Postgres, bot files, and the audit log stay on the machine you run.</text><g fill="#242424" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="16"><rect width="210" height="72" x="48" y="150" fill="#fff" stroke="#e6e6e6" rx="12"/><text x="153" y="192" text-anchor="middle">Web</text><rect width="210" height="72" x="278" y="150" fill="#fff" stroke="#e6e6e6" rx="12"/><text x="383" y="192" text-anchor="middle">Desktop</text><rect width="210" height="72" x="508" y="150" fill="#fff" stroke="#e6e6e6" rx="12"/><text x="613" y="192" text-anchor="middle">Mobile</text><path fill="none" stroke="#242424" stroke-width="1.5" d="M383 222 V268"/><rect width="480" height="88" x="248" y="268" fill="#242424" rx="14"/><text x="488" y="308" fill="#fdfdfd" font-size="18" font-weight="600" text-anchor="middle">API</text><text x="488" y="332" fill="#c8c8c8" font-size="14" text-anchor="middle">Long-running server</text><rect width="300" height="110" x="48" y="420" fill="#fff" stroke="#e6e6e6" rx="14"/><text x="198" y="462" font-weight="600" text-anchor="middle">Graphile Worker</text><text x="198" y="488" fill="#6d6e70" font-size="14" text-anchor="middle">Scheduled and background work</text><rect width="300" height="110" x="380" y="420" fill="#fff" stroke="#e6e6e6" rx="14"/><text x="530" y="462" font-weight="600" text-anchor="middle">Postgres</text><text x="530" y="488" fill="#6d6e70" font-size="14" text-anchor="middle">On the host you operate</text><rect width="440" height="110" x="712" y="420" fill="#fff" stroke="#e6e6e6" rx="14"/><text x="932" y="458" font-weight="600" text-anchor="middle">Computer</text><text x="932" y="484" fill="#6d6e70" font-size="14" text-anchor="middle">Docker by default</text><text x="932" y="506" fill="#6d6e70" font-size="14" text-anchor="middle">E2B, Daytona, CreateOS, or Boat optional</text><path fill="none" stroke="#242424" stroke-width="1.5" d="M198 420 V356 H488"/><path fill="none" stroke="#242424" stroke-width="1.5" d="M530 420 V356"/><path fill="none" stroke="#242424" stroke-width="1.5" d="M848 420 V356 H728"/><rect width="704" height="88" x="248" y="580" fill="#fff" stroke="#2965ec" rx="14"/><text x="600" y="618" font-weight="600" text-anchor="middle">Model provider you configure</text><text x="600" y="644" fill="#6d6e70" font-size="14" text-anchor="middle">Prompts leave the machine. Keys stay on the deployment.</text><path fill="none" stroke="#2965ec" stroke-width="1.5" d="M488 356 V580"/></g></svg>